name: Refresh prices for all listed companies

# Daily closes for every NSE and BSE company, published to the "prices" branch
# (one file per company in p/). The branch is replaced each run, so it doesn't pile up history.
on:
  schedule:
    - cron: "7 11 * * 1-5"   # 16:37 IST, after the close
    - cron: "41 1 * * 2-6"   # 07:11 IST backup
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prices/fetch_prices.py"
      - ".github/workflows/prices.yml"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.54" "pandas>=2.2" requests
      - name: Start from the previous prices
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin prices >/dev/null; then
            git fetch -q --depth 1 origin prices
            git archive FETCH_HEAD | tar -x -C out
          fi
      - run: python prices/fetch_prices.py
      - name: Publish to the prices branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          printf '# Prices\n\nDaily closes for every NSE and BSE company, one file per company in p/. Rebuilt every weekday by the workflow on main; see p/_meta.json.\n' > README.md
          git init -q -b prices
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "prices: $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prices
